name: RSAnt

category: Cryptography

description: |-
  Long ago, Kisuke Urahara hid the Hogyoku deep inside the soul of Rukia Kuchiki.
  Aizen knew. From the shadows, he manipulated Central 46 into sentencing her to death,
  waiting for the Sokyoku to tear the Hogyoku out of her body.
  Every captain, every lieutenant, even Ichigo's rescue... all of it was part of his plan.

  Before leaving Soul Society for Hueco Mundo, Aizen encrypted his orders to Gin and Tosen.
  The message was intercepted. Decrypt it and uncover Aizen's plan.

  **Author**: [Zanpakto](https://jedjmili.github.io/)

