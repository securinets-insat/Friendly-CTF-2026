name: "Force Push"
author: "securinets"
category: "Forensics"
description: |-
  Our platform team had an incident last week. A developer committed the production
  credentials for the logistics API, noticed about an hour later, and "removed" them —
  rolled the branch back and force-pushed over the mistake.

  Legal needs to know exactly what was exposed. We pulled the developer's local clone
  off their laptop. The credentials are not in the repository any more.

  Find them.

type: dynamic
extra:
  function: linear
  initial: 700
  decay: 5
  minimum: 200
