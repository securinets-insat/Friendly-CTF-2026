name: "Signal Lost"
author: "securinets"
category: "Forensics"
description: |-
  We seized a phone. The suspect wiped the relevant conversation inside the messenger app
  before we got to it — but a filesystem extraction was taken.

  Recover what was said, find what was sent, and open it.

  > Work on a **copy** of the database files. Opening them with a tool that writes back can
  > destroy the very thing you're looking for.

