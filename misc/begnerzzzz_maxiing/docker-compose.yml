services:
  begnerzzzz_maxiing:
    build: .
    ports:
      - "9045:10001"
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
    cap_drop:
      - all
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    cpus: "1.5"
    mem_limit: 384m
    pids_limit: 64
    restart: on-failure
