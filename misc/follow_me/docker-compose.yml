services:
  follow_me:
    build: .
    ports:
      - "9044:10001"
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
