name: "The Safehouse"
author: "Taz"
attribution: 'Written by [Taz](https://www.linkedin.com/in/moetezzouari/)'
category: pwn
description: |-
  Rootstar keeps one memory address burned into every single build — same coordinates, every time.

  Land your crew there and it becomes a safehouse: executable, unguarded, always open.

type: dynamic
extra:
  function: linear
  initial: 200
  decay: 5
  minimum: 100

connection_info: nc pwn.securinets.tn 9054

flags:
  - Securinets{f1x3d_4ddr355_1s_4lw4ys_th3_s4f3h0us3}

tags:
  - shellcode

files:
  - main
  - ld-linux-x86-64.so.2
  - libc.so.6

version: "0.1"
