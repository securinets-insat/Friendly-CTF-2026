name: "Night Shift"
author: "fadigaa"
category: "Reverse Engineering"
description: |-
  Tawqit is the terminal Meridian used to publish the overnight roster. It will not show you next week until it gets this week's rotation key.

  The key never leaves the program. It is not compared against anything you can watch it compare, either. Whatever the terminal does to what you type, it does on its own.

  Linux x86-64. Read `NOTICE.txt` before you start.

type: dynamic
extra:
  function: linear
  initial: 200
  decay: 8
  minimum: 100

connection_info:

flags:
  - "Securinets{r0ll_1t_b4ck_0n3_byt3_4t_4_t1m3_5e02}"

tags:
