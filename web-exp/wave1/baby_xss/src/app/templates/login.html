{% extends "base.html" %}
{% block title %}Sign in · Report you Problem{% endblock %}
{% block content %}
<section class="auth"><div class="card">
  <h1>Welcome back</h1><p class="lede">Sign in to report an issue or check on your submissions.</p>
  <form method="post">
    <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button full" type="submit">Sign in</button>
  </form>
  <p class="helper">New here? <a href="/register">Create an account</a></p>
</div></section>
{% endblock %}
