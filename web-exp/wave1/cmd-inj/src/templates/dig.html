<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple DNS lookup tool.">
  <title>dig — DNS lookup</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-ink: #071b33;
      --danger: #ff7b72;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--page);
      color: var(--text);
      font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    main { width: min(100%, 720px); }

    header { margin-bottom: 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: -.08em; }
    .prompt { color: var(--muted); margin: 0; }
    .prompt::before { content: "> "; color: var(--accent); }

    form {
      display: flex;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }

    input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 12px 10px;
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    input::placeholder { color: var(--muted); }

    button {
      border: 0;
      border-radius: 6px;
      padding: 0 18px;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
      font: 700 0.85rem/1 ui-monospace, monospace;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { cursor: wait; opacity: .65; }

    #result {
      display: none;
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
    }
    #result.visible { display: block; }
    .result-label { display: block; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: .78rem; }
    pre { overflow: auto; margin: 0; padding: 16px; min-height: 100px; white-space: pre-wrap; word-break: break-word; font: .82rem/1.55 ui-monospace, monospace; }
    .error { color: var(--danger); }

    footer { margin-top: 20px; color: var(--muted); font-size: .75rem; }
    @media (max-width: 460px) { form { padding: 7px; } button { padding: 0 13px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>dig</h1>
      <p class="prompt">Enter a domain name to look up its DNS records.</p>
    </header>

    <form id="lookup-form" action="/dig" method="post">
      <input id="domain" name="domain" type="text" placeholder="example.com" autocomplete="off" autocapitalize="none" spellcheck="false" required autofocus aria-label="Domain name">
      <button type="submit">LOOK UP</button>
    </form>

    <section id="result" aria-live="polite" aria-label="Lookup result">
      <span class="result-label" id="result-label">RESULT</span>
      <pre id="output"></pre>
    </section>

    <footer>DNS lookup utility</footer>
  </main>

  <script>
    const form = document.querySelector('#lookup-form');
    const domain = document.querySelector('#domain');
    const button = form.querySelector('button');
    const result = document.querySelector('#result');
    const label = document.querySelector('#result-label');
    const output = document.querySelector('#output');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = domain.value.trim();
      if (!name) return;

      button.disabled = true;
      button.textContent = 'LOOKING UP…';
      result.classList.add('visible');
      label.textContent = `LOOKING UP ${name}`;
      output.className = '';
      output.textContent = 'Querying DNS…';

      try {
        const response = await fetch(form.action, { method: 'POST', body: new FormData(form) });
        const data = await response.json();
        label.textContent = data.domain ? `RESULT — ${data.domain}` : 'LOOKUP FAILED';
        output.className = data.error ? 'error' : '';
        output.textContent = data.output || data.error || 'No response received.';
      } catch (error) {
        label.textContent = 'LOOKUP FAILED';
        output.className = 'error';
        output.textContent = 'Unable to reach the lookup service.';
      } finally {
        button.disabled = false;
        button.textContent = 'LOOK UP';
      }
    });
  </script>
</body>
</html>
