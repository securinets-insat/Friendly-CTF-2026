<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.5rem);
      }

      p {
        margin: 1rem 0 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <p>Thanks for stopping by. Please make yourself at home.</p>
    </main>
  </body>
</html>
