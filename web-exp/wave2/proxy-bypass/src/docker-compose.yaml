services:
  app:
    build: ./app
    container_name: app
    networks:
      - internal
    environment:
      - FLAG=Securinets{3xplo1ting_0ld_ht7p_p4rser_inc0nsist3ncy}

  nginx:
    image: nginx:1.22.0
    container_name: nginx-pb
    networks:
      - internal
    ports:
      - "5018:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app


networks:
  internal:
    driver: bridge